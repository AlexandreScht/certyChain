# ─────────────────────────────────────────────────────────────────────────────
# CertifyChain — ADMIN seul (déploiement indépendant du back-office plateforme)
#
#   docker compose -f apps/client/admin/docker-compose.yml up --build -d
#   (contexte relatif à CE fichier → ../../.. = racine du workspace)
#
#   Portail PRIVÉ : par défaut publié sur loopback uniquement — à atteindre via
#   VPN / reverse-proxy (Tailscale/Teleport). Ne surcharger ADMIN_BIND=0.0.0.0
#   que si l'exposition directe est réellement voulue.
#   L'API est EXTERNE : pointer NEXT_PUBLIC_API_URL vers son origine publique.
# ─────────────────────────────────────────────────────────────────────────────

name: certifychain-admin

services:
  admin:
    build:
      context: ../../..
      dockerfile: apps/client/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:3002:3002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
