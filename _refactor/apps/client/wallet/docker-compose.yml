# ─────────────────────────────────────────────────────────────────────────────
# CertifyChain — WALLET seul (déploiement indépendant du portefeuille élève)
#
#   docker compose -f apps/client/wallet/docker-compose.yml up --build -d
#   (contexte relatif à CE fichier → ../../.. = racine du workspace)
#
#   L'API est EXTERNE à ce déploiement : pointer NEXT_PUBLIC_API_URL vers son
#   origine publique au build ET au run. Stack complète = compose racine.
# ─────────────────────────────────────────────────────────────────────────────

name: certifychain-wallet

services:
  wallet:
    build:
      context: ../../..
      dockerfile: apps/client/wallet/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WALLET_BIND:-0.0.0.0}:3001:3001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
