# ─────────────────────────────────────────────────────────────────────────────
# CertifyChain — overlay OPTIONNEL : secrets racine en Docker secrets (P2)
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
#
# Bascule les TROIS secrets qui justifient réellement ce traitement — clé
# privée PKI Ed25519, clé privée PKI ML-DSA, MASTER_ENC_KEY — d'une variable
# d'environnement en clair (visible via `docker inspect` / `/proc/<pid>/environ`,
# cf. `env_file: [.env]` du service `server`) vers un Docker secret : un FICHIER
# monté en tmpfs, jamais exposé par ces deux commandes. `apps/server/src/config/
# env.ts` sait lire la convention `<VAR>_FILE` (le fichier a priorité sur la
# variable directe si les deux sont présents) — voir
# docs/security/root-secrets-rotation.md pour la cérémonie complète.
#
# Prérequis : déposer la VALEUR brute de chaque secret dans `./secrets/<nom>`
# (répertoire gitignoré, voir `secrets/README.md`) AVANT de lancer cette
# commande — Compose refuse de démarrer si un fichier référencé est absent.
#
# Sans cet overlay, rien ne change : les 3 secrets restent lus depuis `.env`
# comme aujourd'hui (comportement par défaut, non affecté).
# ─────────────────────────────────────────────────────────────────────────────

services:
  server:
    secrets:
      - certifychain_root_private_key
      - certifychain_root_pq_private_key
      - master_enc_key
    environment:
      CERTIFYCHAIN_ROOT_PRIVATE_KEY_FILE: /run/secrets/certifychain_root_private_key
      CERTIFYCHAIN_ROOT_PQ_PRIVATE_KEY_FILE: /run/secrets/certifychain_root_pq_private_key
      MASTER_ENC_KEY_FILE: /run/secrets/master_enc_key

secrets:
  certifychain_root_private_key:
    file: ./secrets/certifychain_root_private_key
  certifychain_root_pq_private_key:
    file: ./secrets/certifychain_root_pq_private_key
  master_enc_key:
    file: ./secrets/master_enc_key
