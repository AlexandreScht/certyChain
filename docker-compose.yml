# ─────────────────────────────────────────────────────────────────────────────
# CertifyChain — stack de PRODUCTION (durcie, moindre privilège)
#   db (interne, non exposée) ── server (API Hono) ── web (Next.js) ── admin
#
#   Services strictement nécessaires au produit. Les outils de DÉV (Mailpit,
#   pgweb, mock ProConnect, CoreDNS, Stripe CLI) vivent dans
#   `docker-compose-dev.yml` et NE sont PAS déployés.
#
#   Prod  :  docker compose up --build
#   Dev   :  docker compose -f docker-compose.yml -f docker-compose-dev.yml up --build
#
# Convention de configuration :
#   • Variables NON sensibles → écrites ICI (versionnées, visibles, auditables).
#     Celles propres au déploiement (domaines, origines…) utilisent
#     `${VAR:-défaut}` : surchargeables par une variable shell au déploiement,
#     sans rien committer.
#   • SECRETS (mots de passe, clés, jetons) → uniquement dans `.env` (gitignoré),
#     injectés via `env_file`. Voir `.env.example` et `GUIDE_PROCONNECT_STRIPE.md`.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Identifiants non sensibles → en clair ici. Seul le mot de passe (secret)
      # vient du `.env` (substitution depuis le `.env` auto-chargé par compose).
      POSTGRES_USER: certify
      POSTGRES_DB: certifychain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Data dir under the named volume; avoids writing to the (read-only) rootfs.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    # No published ports — only reachable from the internal backend network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certify -d certifychain"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Caps strictement nécessaires à l'entrypoint officiel (chown/su-exec initdb).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /tmp
      - /run/postgresql
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  server:
    build:
      # Contexte = racine (le lockfile pnpm du workspace y vit).
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # SECRETS uniquement (JWT, MASTER_ENC_KEY, OTP_PEPPER, AUDIT_IP_SALT, clé
    # racine, identifiants SMTP/INSEE/Gemini/ProConnect/Stripe, bootstrap admin).
    env_file: [.env]
    environment:
      # ── Config NON sensible (versionnée) ───────────────────────────────────
      NODE_ENV: production
      PORT: "4000"
      # La DB est jointe via le réseau interne (host = "db") ; seul le mot de
      # passe (secret) provient du `.env`.
      DATABASE_URL: postgresql://certify:${POSTGRES_PASSWORD}@db:5432/certifychain
      # Origines navigateur autorisées (CORS) + liens email/OAuth. Propres au
      # déploiement → surchargeables par variable shell, défaut = local.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WALLET_ORIGIN: ${WALLET_ORIGIN:-http://localhost:3001}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3002}
      # Sessions
      ACCESS_TOKEN_TTL: "900"
      REFRESH_TOKEN_TTL: "2592000"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      # Prod = HTTPS → cookies Secure. La surcharge dev repasse à "false".
      COOKIE_SECURE: "true"
      # API derrière un reverse proxy de confiance en prod (TLS/IP réelle).
      # ⚠️ Ne laisser "true" QUE si un proxy renseigne X-Forwarded-For ; sinon
      # une IP cliente peut être usurpée (rate-limit). La surcharge dev = "false".
      TRUST_PROXY: "true"
      # Rate limiting (par IP / fenêtre)
      RATE_LIMIT_WINDOW: "60"
      RATE_LIMIT_MAX: "100"
      # Applique les migrations Drizzle au démarrage (pratique en conteneur).
      MIGRATE_ON_START: "true"
      # Registre SIRENE (INSEE) — base + header (la CLÉ est un secret du .env).
      INSEE_API_BASE: https://api.insee.fr/api-sirene/3.11
      INSEE_API_KEY_HEADER: X-INSEE-Api-Key-Integration
      # Modèle Gemini (la CLÉ est un secret du .env).
      GEMINI_MODEL: gemini-flash-latest
      # Destinataire des alertes « école à valider » (override possible).
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-admin-review@certifychain.local}
      # ProConnect — issuer/redirect/scopes NON sensibles (le CLIENT_ID/SECRET
      # sont des secrets du .env). En prod, override l'issuer + la redirect URI.
      PROCONNECT_ISSUER: ${PROCONNECT_ISSUER:-https://fca.integ01.dev-agentconnect.fr/api/v2}
      PROCONNECT_REDIRECT_URI: ${PROCONNECT_REDIRECT_URI:-http://localhost:4000/verification/proconnect/callback}
      PROCONNECT_SCOPES: "openid siret given_name usual_name email"
      # Stripe — base API NON sensible (SECRET_KEY/WEBHOOK_SECRET = secrets .env).
      STRIPE_API_BASE: https://api.stripe.com
      # Abonnement (§5.1) — ids de Price Stripe (NON sensibles, pas des clés).
      # Vide = offre non proposée (dégradation propre). À créer dans le Dashboard
      # Stripe (produit récurrent mensuel) puis renseigner ici.
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      # Vérification postale — tarif/devise/délai (NON sensibles).
      POSTAL_VERIFICATION_PRICE_CENTS: "500"
      POSTAL_VERIFICATION_CURRENCY: eur
      POSTAL_MAX_DELIVERY_DAYS: "15"
      POSTAL_DISPATCH_EMAIL: ${POSTAL_DISPATCH_EMAIL:-postal-dispatch@certifychain.local}
      # ── Email (SMTP) ───────────────────────────────────────────────────────
      # En prod : configurer le provider via le `.env` (SMTP_HOST/PORT/USER/
      # PASSWORD/SECURE/FROM). Vide → les emails retombent dans les logs.
      # En dev, la surcharge compose pointe vers Mailpit.
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    ports:
      - "4000:4000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      server:
        condition: service_healthy
    networks: [frontend]
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

  wallet:
    # Student wallet portal (Next.js). Public-facing user app, same hardening as `web`.
    build:
      context: .
      dockerfile: wallet/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      server:
        condition: service_healthy
    networks: [frontend]
    ports:
      - "3001:3001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

  admin:
    # Private admin back-office (Next.js). Not publicly exposed in prod — sits
    # behind Teleport + Tailscale/Headscale. Same hardening as `web`.
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      server:
        condition: service_healthy
    networks: [frontend]
    ports:
      - "3002:3002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

networks:
  backend:
    internal: true   # DB isolée : aucune route vers l'extérieur
  frontend:

volumes:
  pgdata:
